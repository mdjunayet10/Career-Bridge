name: career_bridge
description: Career Bridge job portal for job seekers, employers, and administrators.
publish_to: "none"
version: 1.4.7+24

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  crypto: ^3.0.6
  file_picker: ^8.1.7
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/career_bridge_selected_logo.png
    - assets/logos/career_bridge_nav_logo.png
    - assets/logos/career_bridge_logo_icon.png
    - assets/logos/google_g.png
    - assets/company_logos/
