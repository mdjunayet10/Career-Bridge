name: career_bridge
description: Career Bridge job portal for job seekers, employers, and administrators.
publish_to: "none"
version: 1.7.5+33

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  crypto: ^3.0.6
  file_picker: ^8.1.7
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800

  assets:
    - assets/logos/career_bridge_selected_logo.png
    - assets/logos/career_bridge_nav_logo.png
    - assets/logos/career_bridge_logo_icon.png
    - assets/logos/google_g.png
    - assets/company_logos/
    - assets/cv_fonts/
